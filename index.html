<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <!-- 只许连自己的站点：即使以后有人升级了带遥测的库，画面和数据也出不去 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' blob: data:; font-src 'self'; worker-src 'self' blob:" />
    <meta name="description" content="观物：心有一事，对着眼前的东西一扫，按《梅花易数》物数占起卦。画面只在你的手机里处理。" />
    <title>观物 · 见物起卦</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050505'/%3E%3Cg fill='%23ece5d4'%3E%3Crect x='14' y='14' width='36' height='5'/%3E%3Crect x='14' y='24' width='15' height='5'/%3E%3Crect x='35' y='24' width='15' height='5'/%3E%3Crect x='14' y='34' width='36' height='5'/%3E%3C/g%3E%3Crect x='14' y='44' width='36' height='5' fill='%23b8321f'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <video id="camera" playsinline muted autoplay></video>
    <input id="photo-input" type="file" accept="image/*" hidden />

    <main id="ui">
      <section id="home" class="screen active" aria-labelledby="home-title">
        <h1 id="home-title" class="title">观物</h1>
        <p class="subtitle">心有一事　见物起卦</p>
        <button id="start" class="start-button" type="button" aria-label="开始起卦"><i aria-hidden="true"></i><span>起 卦</span></button>
        <button id="home-photo" class="link-button quiet" type="button">以照片起卦</button>
        <p id="inapp-tip" class="inapp-tip" hidden>此处或开不了相机。请点右上角"…"，选"在浏览器打开"</p>
        <p class="footnote">画面只在本机处理，不上传　·　典籍文化体验，仅供娱乐<br /><a href="https://github.com/YuanTong-Wu/guanwu" target="_blank" rel="noopener">开源于 GitHub</a></p>
      </section>

      <section id="loading" class="screen">
        <div class="spinner" aria-hidden="true"></div>
        <p id="loading-text" role="status">稍候</p>
      </section>

      <section id="scan" class="screen">
        <p id="scan-hint" class="scan-hint" aria-live="polite">对准可数之物，静候片刻</p>
        <p id="scan-count" class="scan-count" aria-hidden="true"></p>
        <div class="scan-actions">
          <button id="lock" class="line-button" type="button" aria-label="就数这些，起卦"><i aria-hidden="true"></i>就此起卦</button>
        </div>
        <div class="scan-fallbacks">
          <button id="use-photo" class="link-button" type="button">以照片起卦</button>
          <button id="use-time" class="link-button" type="button">以时起卦</button>
        </div>
      </section>

      <section id="ended" class="screen">
        <p id="result-text" class="sr-only" aria-live="polite"></p>
        <figure id="poster-wrap" class="poster" hidden>
          <img id="poster" alt="本次起卦的画面，长按可保存" />
        </figure>
        <p id="poster-note" class="poster-note" hidden></p>
        <div class="end-actions">
          <button id="show-reading" class="line-button" type="button"><i aria-hidden="true"></i>看卦辞</button>
          <button id="save-video" class="line-button plain" type="button" hidden>存视频</button>
          <button id="again" class="line-button plain" type="button">再占</button>
        </div>
      </section>

      <section id="reading" class="panel" role="dialog" aria-modal="true" aria-labelledby="reading-title" hidden>
        <div class="panel-inner">
          <button id="close-reading" class="close-button" type="button" aria-label="关闭">×</button>
          <div id="reading-body"></div>
        </div>
      </section>

      <div id="toast" class="toast" role="status" hidden></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
